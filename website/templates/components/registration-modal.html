<div
  class="fixed inset-0 hidden items-center justify-center bg-black/50"
  id="registration-modal"
>
  <div
    class="bg-white rounded-md flex flex-col items-center p-6 max-w-80 gap-5"
  >
    <div class="p-2 rounded-md text-green-600 bg-green-600/10">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="3"
        stroke="currentColor"
        class="size-7"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m4.5 12.75 6 6 9-13.5"
        />
      </svg>
    </div>
    <div class="flex-col flex items-center text-center">
      <span class="text-lg font-semibold">Success!</span>
      <span class="text-sm text-gray-600"
        >Account registration completed, waiting for admin's approval</span
      >
    </div>
    <a href="{{url_for('auth.login')}}">
      <button
        id="return-login-btn"
        class="px-4 py-3 rounded-md hover:bg-gray-200 text-sm font-medium flex gap-4 items-center"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="size-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"
          />
        </svg>

        <span>Return to Login</span>
      </button>
    </a>
  </div>
</div>
