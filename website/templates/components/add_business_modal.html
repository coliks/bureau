<div

  class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden z-50"
>

            />

          viewBox="0 0 24 24"
          stroke-width="2"

      class="p-6 overflow-y-auto"

      action="{{ url_for('admin.add_business') }}"

              placeholder="Enter business name"

        </div>
        <div class="md:col-span-2">

          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
            >

        <div>

          class="flex-1 px-5 py-3 bg-green-600 text-white rounded-md font-semibold text-sm hover:bg-green-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-green-500/30"

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const feeInputs = document.querySelectorAll(".fee-input");
      feeInputs.forEach((input) => {
        input.addEventListener("keydown", function (e) {
          if (
            ![
              "Backspace",
              "Delete",
              "ArrowLeft",
              "ArrowRight",
              "Tab",
              "Enter",
              ".",
            ].includes(e.key) &&
            !/^\d$/.test(e.key)
          ) {
            e.preventDefault();
          }
        });

        input.addEventListener("input", function (e) {
          this.value = this.value.replace(/[^0-9.]/g, "");
          const dotIndex = this.value.indexOf(".");
          if (dotIndex !== -1) {
            this.value =
              this.value.slice(0, dotIndex + 1) +
              this.value.slice(dotIndex + 1).replace(/\./g, "");
          }
        });
      });
    });
  </script>
</div>
