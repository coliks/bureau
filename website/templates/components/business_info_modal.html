<div
  id="business-info-modal"
  class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden z-50"
>
  <div
    class="bg-white rounded-md border border-gray-200 w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden"
  >
    <div
      class="bg-blue-600 p-6 text-white flex items-start justify-between border-b border-blue-700"
    >
      <div>
        <h2 class="text-xl font-bold flex items-center gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.25a.75.75 0 01-.75-.75v-12a.75.75 0 01.75-.75h18a.75.75 0 01.75.75v9a.75.75 0 01-.75.75H21m-4.5 0a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75m4.5 0V15m-4.5 3v-3m0 0h-3m3 0h3"
            />
          </svg>
          Business Info
        </h2>
        <p class="text-blue-100 text-sm mt-1">
          View or edit business information
        </p>
      </div>
      <button
        id="close-business-info-modal"
        class="p-2 rounded-md hover:bg-white/10 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-white/30"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
    <form
      id="edit-business-form"
      class="p-6 overflow-y-auto"
      method="POST"
      action="{{ url_for('admin.edit_business') }}"
      enctype="multipart/form-data"
    >
      <input type="hidden" name="business_id" id="edit-business-id" value="" />
      <div class="mb-8">
        <label
          class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 block"
          >Business Images</label
        >
        <div
          class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4"
          id="business-images-grid"
        >
          <div
            class="aspect-square bg-gray-50 border-2 border-dashed border-gray-300 rounded-md flex flex-col items-center justify-center cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors duration-200 group"
            id="business-image-upload"
          >
            <input
              type="file"
              name="business_images"
              id="business-image-input"
              accept="image/*"
              multiple
              class="hidden"
            />
            <input
              type="hidden"
              name="existing_business_images"
              id="existing-business-images"
              value=""
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-10 h-10 text-gray-400 group-hover:text-blue-500 transition-colors duration-200"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"
              />
            </svg>
            <span
              class="text-xs text-gray-500 group-hover:text-blue-500 mt-2 transition-colors duration-200"
              >Click to upload</span
            >
          </div>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="md:col-span-2">
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Establishment Name</label
          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"
              />
            </svg>
            <input
              type="text"
              name="business_name"
              id="edit-business-name"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div class="md:col-span-2">
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Establishment Address</label
          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"
              />
            </svg>
            <input
              type="text"
              name="business_address"
              id="edit-business-address"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"

          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"

              />

            <input
              type="text"
              name="owner_name"
              id="edit-owner-name"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Representative Name</label
          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0ZM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632Z"

            <input

            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"

            <svg
              xmlns="http://www.w3.org/2000/svg"

              viewBox="0 0 24 24"
              stroke-width="1.8"

              />

            <input
              type="text"
              name="contact_number"
              id="edit-contact-number"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Business ID</label
          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M7.864 4.243A7.5 7.5 0 0119.5 10.5c0 2.92-.556 5.709-1.568 8.268M5.742 6.364A7.465 7.465 0 004.5 10.5a7.464 7.464 0 01-1.15 3.993m1.989 3.559A11.209 11.209 0 008.25 10.5a3.75 3.75 0 117.5 0c0 .527-.021 1.049-.064 1.565M12 10.5a14.94 14.94 0 01-3.6 9.75m6.633-4.596a18.666 18.666 0 01-2.485 5.33"
              />
            </svg>
            <input
              type="text"
              name="business_id_code"
              id="edit-business-id-code"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >OR Number</label
          >
          <div class="relative">
            <svg
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 256 256"

            </svg>
            <input
              type="text"
              name="or_no"
              id="edit-or-no"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Application No</label
          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"

              />
            </svg>
            <input
              type="text"
              name="application_no"
              id="edit-application-no"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Control No</label
          >
          <div class="relative">
            <svg
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              fill="currentColor"
              viewBox="0 0 256 256"
            >
              <path
                d="M216,152H168V104h48a8,8,0,0,0,0-16H168V40a8,8,0,0,0-16,0V88H104V40a8,8,0,0,0-16,0V88H40a8,8,0,0,0,0,16H88v48H40a8,8,0,0,0,0,16H88v48a8,8,0,0,0,16,0V168h48v48a8,8,0,0,0,16,0V168h48a8,8,0,0,0,0-16Zm-112,0V104h48v48Z"
              ></path>
            </svg>
            <input
              type="text"
              name="control_no"
              id="edit-control-no"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Fire Inspection Fee</label

          <div class="relative">
            <svg
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              fill="currentColor"
              viewBox="0 0 256 256"
            >
              <path
                d="M128,88a40,40,0,1,0,40,40A40,40,0,0,0,128,88Zm0,64a24,24,0,1,1,24-24A24,24,0,0,1,128,152ZM240,56H16a8,8,0,0,0-8,8V192a8,8,0,0,0,8,8H240a8,8,0,0,0,8-8V64A8,8,0,0,0,240,56ZM193.65,184H62.35A56.78,56.78,0,0,0,24,145.65v-35.3A56.78,56.78,0,0,0,62.35,72h131.3A56.78,56.78,0,0,0,232,110.35v35.3A56.78,56.78,0,0,0,193.65,184ZM232,93.37A40.81,40.81,0,0,1,210.63,72H232ZM45.37,72A40.81,40.81,0,0,1,24,93.37V72ZM24,162.63A40.81,40.81,0,0,1,45.37,184H24ZM210.63,184A40.81,40.81,0,0,1,232,162.63V184Z"
              ></path>
            </svg>
            <input
              type="text"
              name="fire_inspection_fee"
              id="edit-fire-inspection-fee"
              class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors duration-200 fee-input"
            />
          </div>
        </div>
        <div>
          <label
            class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 block"
            >Status</label
          >
          <div class="relative">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
            >

            >
              <option value="New">New</option>
              <option value="Renew">Renew</option>
              <option value="Archived">Archived</option>
            </select>
          </div>
        </div>
      </div>
    </form>
    <div class="p-6 bg-gray-50 border-t border-gray-200 flex gap-3 justify-end">
      <button
        id="archive-business-btn"
        class="px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-md font-medium text-sm hover:bg-gray-100 hover:border-gray-300 transition-colors duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-gray-500/20"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"

          stroke-width="2"

          />
        </svg>
        Archive
      </button>
      <button
        type="submit"
        form="edit-business-form"
        class="px-4 py-2.5 bg-blue-600 text-white rounded-md font-semibold text-sm hover:bg-blue-700 transition-colors duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-4 h-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m16.862 4.487 1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"
          />
        </svg>
        Save Changes
      </button>

</div>

<div
  id="confirm-modal"
  class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden z-[60]"
>
  <div class="bg-white rounded-md border border-gray-200 w-full max-w-md p-6">
    <div class="text-center mb-6">
      <div
        class="w-16 h-16 mx-auto mb-4 rounded-full bg-blue-100 flex items-center justify-center"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-8 h-8 text-blue-600"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9.879 7.519c1.171-1.902 3.07-1.902 4.242 0 1.172 1.902 3.071 1.902 4.242 0 1.171-1.902 3.07-1.902 4.242 0 1.172 1.902 3.071 1.902 4.242 0"
          />
        </svg>
      </div>
      <h3 class="text-xl font-bold text-gray-800 mb-2">Save Changes?</h3>
      <p class="text-gray-600">Are you sure you want to save these changes?</p>
    </div>
    <div class="flex gap-3">
      <button
        id="confirm-cancel-btn"
        class="flex-1 px-4 py-2.5 bg-white border border-gray-200 text-gray-600 rounded-md font-medium text-sm hover:bg-gray-100 hover:border-gray-300 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500/20"
      >
        Cancel
      </button>
      <button
        id="confirm-save-btn"
        class="flex-1 px-4 py-2.5 bg-blue-600 text-white rounded-md font-semibold text-sm hover:bg-blue-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
      >
        Yes, Save
